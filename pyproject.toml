[project]
name = "model-converter"
version = "0.1.0"
description = "Convert Hugging Face models into the formats cnverc runs."
# The torch, onnxruntime and openai-whisper wheels this needs are published for
# 3.12; this PC's default Python is newer than they support.
requires-python = "==3.12.*"
dependencies = [
    "torch",
    "transformers",
    "safetensors",
    "huggingface_hub",
    "openai-whisper",
    "onnx",
    "onnxruntime",
    "kaldi-native-fbank",
    "soundfile",
    "librosa",
    "numpy",
    "pyyaml",
    "sherpa-onnx==1.13.8",
    # sherpa-onnx's wheels require this, but its sdist declares no
    # dependencies and uv locks from the sdist's metadata, so without this line
    # it is silently left out. It puts onnxruntime.dll (1.28.2, the version
    # cnverc links statically) beside sherpa-onnx's extension.
    "sherpa-onnx-core==1.13.8",
]

[tool.uv]
package = false
# Every machine resolves and installs the same way.
required-version = ">=0.11.26,<0.12"

# The export runs on the CPU. The CPU-only build avoids a multi-gigabyte CUDA
# download that nothing here uses.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
