# A full fine-tune of Whisper large-v3-turbo on , MIT licence, F32 safetensors.
# Same architecture as the Whisper turbo cnverc already runs, so the comparison in step 7 is
# fair. It is also 128-mel, which is what the export script's name rule got wrong.
model_id: oddadmix/whisper-large-v3-turbo-arabic-dialectal
base_model: openai/whisper-large-v3-turbo   # where the tokenizer comes from
run_name: ar-lg-v3-turbo-oddadmix
language: ar                                # forced when transcribing in steps 3-5

engine:
  folder_name: whisper-large-v3-turbo-arabic-dialectal   # the folder inside cnverc's models/asr/
  display_name: Whisper large-v3-turbo Arabic (oddadmix, int8)
  languages: [ar]

use_fp32: false        # true ships the full-size files if step 5 finds int8 unusable

test:
  wav: test_audio/ar-16k.wav                # 16 kHz mono
